<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Oceanic Slate into Rich Forest Emerald -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Radial Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Emblem Stroke Gradient: Vibrant Mint to Emerald to Sky Blue -->
    <linearGradient id="emblemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Heart Silhouette Fill -->
    <linearGradient id="heartInnerFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12" />
    </linearGradient>

    <!-- Sprout Leaves Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for Emblem -->
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle App Badge Container -->
  <rect 
    x="18" 
    y="18" 
    width="476" 
    height="476" 
    rx="116" 
    fill="url(#bgGradient)" 
    stroke="url(#borderGlow)" 
    stroke-width="16" 
  />

  <!-- Ambient Glow -->
  <rect 
    x="18" 
    y="18" 
    width="476" 
    height="476" 
    rx="116" 
    fill="url(#ambientGlow)" 
  />

  <!-- Agro Sprout / Leaves on top center (Symbol of Agricultural Care & Growth) -->
  <g transform="translate(256, 126)">
    <!-- Central tiny stem -->
    <path 
      d="M0,28 Q0,0 2,-14" 
      fill="none" 
      stroke="#34d399" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
    <!-- Left Leaf -->
    <path 
      d="M0,12 C-16,4 -32,-6 -36,-26 C-14,-28 -2,-12 0,12 Z" 
      fill="url(#sproutGrad)" 
      opacity="0.95" 
    />
    <!-- Right Leaf -->
    <path 
      d="M2,6 C18,0 34,-12 36,-32 C14,-32 2,-16 2,6 Z" 
      fill="url(#sproutGrad)" 
      opacity="0.95" 
    />
  </g>

  <!-- Heart Handshake Emblem (Caring, Senior Assistance & Mutual Aid) -->
  <g filter="url(#glowDrop)" transform="translate(256, 276) scale(14.8) translate(-12, -12)">
    <!-- Subtle semi-translucent heart backing for strong contrast -->
    <path 
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      fill="url(#heartInnerFill)"
    />

    <!-- Sharp, crisp HeartHandshake Vector -->
    <path 
      d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762" 
      fill="none" 
      stroke="url(#emblemGradient)" 
      stroke-width="2.3" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- Vitality Beacon Dot (Top Right) -->
  <circle cx="396" cy="116" r="14" fill="#38bdf8" />
  <circle cx="396" cy="116" r="7" fill="#ffffff" />
</svg>